[tool.pytest]
pythonpath = ["tools"]
testpaths = ["tests"]
log_format = "%(levelname)s %(message)s"

[tool.ruff]
src = ["tools", "tests"]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "S", "C4", "SIM", "T20", "ARG", "G", "LOG", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare `assert` and mock credential strings, and a
# double's signature has to mirror the real one whether or not it reads every argument.
"tests/*" = ["S101", "S105", "S106", "ARG001", "ARG002", "ARG005"]
